# Replays the calls bullet-bots' built-in strategies answered (recorded from their own tests, under
# the bot's real StrategyHost) on the built-ins' crates, and compares the intents. Tests only.
[package]
license.workspace = true
name = "bb-strategy-parity"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Replays the built-in strategies' recorded calls on their crates"

[lints]
workspace = true

[dependencies]
bb-strategy-sdk = { workspace = true, features = ["testing"] }
serde = { workspace = true }
serde_json = { workspace = true }

[lib]
doctest = false
