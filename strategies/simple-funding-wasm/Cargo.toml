[package]
license.workspace = true
name = "bb-strategy-simple-funding-wasm"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "A dollar-neutral funding carry basket on Bullet markets, as a WASM component"

[lints]
workspace = true

[lib]
# cdylib: the wasm32-wasip2 component; rlib: native tests.
crate-type = ["cdylib", "rlib"]
doctest = false

[dependencies]
bb-strategy-sdk = { workspace = true }
bb-strategy-support = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
schemars = { workspace = true }
rust_decimal = { workspace = true }

[dev-dependencies]
bb-strategy-sdk = { workspace = true, features = ["testing"] }
bb-strategy-parity = { workspace = true }
serde_json = { workspace = true }
rust_decimal = { workspace = true }
