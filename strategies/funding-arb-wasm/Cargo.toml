[package]
license.workspace = true
name = "bb-strategy-funding-arb-wasm"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "bullet-bots' funding arb as a WASM component: Bullet x Hyperliquid funding carry, one symbol"

[lints]
workspace = true

[lib]
# cdylib: the wasm32-wasip2 component; rlib: native tests.
crate-type = ["cdylib", "rlib"]
doctest = false

[dependencies]
bb-strategy-sdk = { workspace = true }
bb-strategy-support = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
schemars = { workspace = true }
rust_decimal = { workspace = true }

[dev-dependencies]
bb-strategy-sdk = { workspace = true, features = ["testing"] }
bb-strategy-parity = { workspace = true }
serde_json = { workspace = true }
rust_decimal = { workspace = true }
