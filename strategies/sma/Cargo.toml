[package]
name = "bb-strategy-sma"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "An example indicator on bb-strategy-sdk: a moving average warmed up on past candles at start"

[lints]
workspace = true

[lib]
# cdylib: the wasm32-wasip2 component; rlib: native tests and hosts.
crate-type = ["cdylib", "rlib"]
doctest = false

[dependencies]
bb-strategy-sdk = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
schemars = { workspace = true }

[dev-dependencies]
bb-strategy-sdk = { workspace = true, features = ["testing"] }
