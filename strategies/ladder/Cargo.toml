[package]
license.workspace = true
name = "bb-strategy-ladder"
version = "0.5.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "An example strategy written against bb-strategy-sdk: a ladder of buys and sells around the mid"

[lints]
workspace = true

[lib]
# cdylib: the wasm32-wasip2 component; rlib: native tests and hosts.
crate-type = ["cdylib", "rlib"]
doctest = false

[dependencies]
bb-strategy-sdk = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
schemars = { workspace = true }
rust_decimal = { workspace = true }

[dev-dependencies]
bb-strategy-sdk = { workspace = true, features = ["testing"] }
