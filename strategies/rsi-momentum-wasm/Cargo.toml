[package]
license.workspace = true
name = "bb-strategy-rsi-momentum-wasm"
version = "0.2.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "bullet-bots' rsi-momentum as a WASM component: RSI momentum on one Bullet market"

[lints]
workspace = true

[lib]
# cdylib: the wasm32-wasip2 component; rlib: native tests.
crate-type = ["cdylib", "rlib"]
doctest = false

[dependencies]
bb-strategy-sdk = { workspace = true }
bb-strategy-support = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
schemars = { workspace = true }
rust_decimal = { workspace = true }

[dev-dependencies]
bb-strategy-sdk = { workspace = true, features = ["testing"] }
bb-strategy-parity = { workspace = true }
serde_json = { workspace = true }
rust_decimal = { workspace = true }
