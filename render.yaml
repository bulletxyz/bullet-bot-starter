services:
  - type: web
    name: bullet-bot
    runtime: image
    image:
      url: ghcr.io/bulletxyz/bullet-bots:latest
    region: singapore
    plan: starter
    numInstances: 1
    healthCheckPath: /health
    envVars:
      - key: BB__API__HTTP__PUBLIC_HOST
        fromService:
          name: bullet-bot
          type: web
          envVarKey: RENDER_EXTERNAL_HOSTNAME
    disk:
      name: bot-data
      mountPath: /data
      sizeGB: 1
